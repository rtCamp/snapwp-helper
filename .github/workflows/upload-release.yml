name: Upload Release Package

on:
    release:
        types: [published]

permissions:
    contents: write
    packages: write

jobs:
    tag:
        name: Upload New Release
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.32.0@v2
              with:
                  php-version: 7.4
                  coverage: none
                  extensions: mbstring, intl
                  tools: composer:v2

            - name: Install Composer dependencies
              uses: ramsey/composer-install@a35c6ebd3d08125aaf8852dff361e686a1a67947 # v3.1.0@v3
              with:
                  composer-options: '--no-progress'

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22

            - name: Install Node.js dependencies
              run: npm ci
              env:
                  CI: true

            - name: Build assets
              run: npm run build:dist

            - name: Create Artifact
              run: |
                  npm run plugin-zip

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: snapwp-helper
                  path: snapwp-helper.zip

            - name: Upload release asset
              uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
              with:
                  files: snapwp-helper.zip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
