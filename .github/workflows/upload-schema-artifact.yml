name: Upload Schema Artifact

on:
    release:
        types: [published]

permissions:
    contents: write
    actions: write

jobs:
    run:
        runs-on: ubuntu-latest
        name: Generate and Upload WPGraphQL Schema Artifact
        services:
            mariadb:
                image: mariadb:10
                ports:
                    - 3306:3306
                env:
                    MYSQL_ROOT_PASSWORD: password
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup PHP w/ Composer & WP-CLI
              uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.32.0@v2
              with:
                  php-version: 8.2
                  extensions: mbstring, intl, bcmath, exif, gd, mysqli, opcache, zip, pdo_mysql
                  coverage: none
                  tools: composer:v2, wp-cli

            - name: Install Composer dependencies
              uses: ramsey/composer-install@a35c6ebd3d08125aaf8852dff361e686a1a67947 # v3.1.0@v3
              with:
                  composer-options: '--no-progress'

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22

            - name: Setup GraphQL Schema Linter
              run: npm install -g graphql-schema-linter@^3.0 graphql@^16

            - name: Install Node.js dependencies
              run: npm ci
              env:
                  CI: true

            - name: Build JS assets
              run: npm run build:js

            - name: Setup WordPress
              run: |
                  cp .env.dist .env
                  npm run install-test-env

            - name: Generate the Static Schema
              run: |
                  cd /tmp/wordpress/
                  # Output: /tmp/schema.graphql
                  wp graphql generate-static-schema --allow-root

            - name: Upload schema as release artifact
              uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
              with:
                  files: /tmp/schema.graphql
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
